name: repository validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install core and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Verify immutable results and repository links
        run: python scripts/verify_repository.py

      - name: Run unit and synthetic integration tests
        run: python -m pytest -q

      - name: Rebuild whole-project overview
        run: python scripts/build_github_overview.py

      - name: Confirm generated overview is current
        run: git diff --exit-code -- results/reports/github_overview docs/assets/project_overview.png docs/assets/complete_method_matrix.png
