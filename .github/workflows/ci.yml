name: repository validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install core and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Verify immutable results and repository links
        run: python scripts/verify_repository.py

      - name: Run unit and synthetic integration tests
        run: python -m pytest -q

      - name: Rebuild whole-project overview
        run: python scripts/build_github_overview.py

      - name: Confirm generated overview data is current
        # PNG/PDF bytes vary across operating-system font and rendering stacks.
        # The repository verifier checks that the committed figures exist and
        # have the intended dimensions; compare deterministic report data here.
        run: |
          git diff --exit-code -- \
            results/reports/main_report/tables/overview/benchmark_coverage.csv \
            results/reports/main_report/tables/overview/all_method_summary.csv \
            results/reports/main_report/tables/overview/selected_methods_by_budget.csv \
            results/reports/main_report/tables/overview/all_methods_by_budget.csv \
            results/reports/main_report/tables/overview/all_methods_by_dataset.csv \
            results/reports/main_report/tables/overview/manifest.json
