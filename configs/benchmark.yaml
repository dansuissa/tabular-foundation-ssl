neural_ssl_defaults:
  batch_size: 256
  hidden_dim: 128
  embedding_dim: 64
  dropout: 0.1
  learning_rate: 0.001
  weight_decay: 0.0001
  max_epochs: 100
  pretrain_epochs: 50
  patience: 10
  device: cpu
sslae:
  recon_weight: 1.0
vime:
  mask_prob: 0.3
  mask_loss_weight: 1.0
  feature_loss_weight: 1.0
  consistency_weight: 0.1
vime_lite:
  mask_prob: 0.3
  mask_loss_weight: 1.0
  consistency_weight: 0.1
scarf:
  corruption_rate: 0.3
  temperature: 0.1
local_debug_methods:
  - logistic_regression
  - xgboost
  - label_spreading
  - self_training_xgboost
  - rpl_lite_xgboost
