# ssl-core: classical sklearn / trees / analysis
# Create with: bash scripts/cluster/bootstrap_ssl_core.sh
name: ssl-core
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy>=1.24
  - pandas>=2.0
  - scikit-learn>=1.3
  - pyyaml>=6.0
  - matplotlib>=3.7
  - seaborn>=0.13
  - scipy
  - pip:
      - xgboost>=2.0
      - lightgbm>=4.0
      - catboost>=1.2
